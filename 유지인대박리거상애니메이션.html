<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>듀얼플레인 박리 실리프팅 거상술 - 14초 메디컬 애니메이션</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #f8f4ee;
      border-radius: 0.85rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    input[type="range"] {
      accent-color: #0d9488;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-5">
  <!-- Top Bar: Title Only (Centered Horizontally) -->
  <header class="max-w-7xl w-full mx-auto mb-3 flex items-center justify-center bg-slate-900/90 border border-teal-500/30 rounded-xl px-6 py-3 shadow-lg">
    <h1 class="text-lg md:text-2xl font-bold tracking-tight text-white text-center flex items-center gap-2.5">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-teal-400 animate-pulse"></span>
      듀얼플레인 박리 실리프팅 거상술
      <span class="text-xs font-normal text-teal-400/80 border border-teal-500/40 rounded px-2 py-0.5 ml-1">14s 3D Medical Animation</span>
    </h1>
  </header>

  <!-- Main 16:9 Animation Canvas -->
  <main class="max-w-7xl w-full mx-auto flex-1 flex flex-col items-center justify-center">
    <div class="relative w-full">
      <canvas id="animCanvas" width="1920" height="1080"></canvas>
    </div>

    <!-- Minimal Interactive Playback Controls Below Canvas -->
    <div class="w-full mt-3 bg-slate-900/95 border border-slate-700/80 rounded-xl p-3 flex flex-col gap-2.5 shadow-xl">
      <div class="flex items-center gap-3">
        <button id="playPauseBtn" type="button" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs md:text-sm flex items-center gap-1.5 transition shadow">
          <span id="playIcon">❚❚ 일시정지</span>
        </button>
        <button id="restartBtn" type="button" class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs md:text-sm transition">
          ↺ 처음부터
        </button>
        <div class="flex-1 flex items-center gap-2">
          <input id="timeSlider" type="range" min="0" max="14" step="0.02" value="0" class="w-full cursor-pointer h-2.5 rounded-lg" aria-label="타임라인 슬라이더" />
        </div>
        <div class="text-xs md:text-sm font-mono font-bold text-teal-300 min-w-[90px] text-right">
          <span id="timeDisplay">0.0s</span> / 14.0s
        </div>
        <button id="refModalBtn" type="button" class="px-3 py-2 rounded-lg bg-indigo-600/80 hover:bg-indigo-500 text-white text-xs font-semibold transition">
          참고 도해 보기
        </button>
      </div>
      <div id="liveCaption" class="text-xs md:text-sm text-slate-200 bg-slate-800/90 border border-slate-700 rounded-lg px-4 py-2.5 flex items-center justify-between">
        <span id="captionMain" class="font-semibold text-teal-300">STEP 1. 표층 박리 (1st Plane)</span>
        <span id="captionSub" class="text-slate-400 hidden sm:inline">특수 캐뉼라가 표층지방 하방 플레인을 정확히 지나가며 확장된 간극 내 유지인대를 해리</span>
      </div>
    </div>
  </main>

  <!-- Reference Modal -->
  <div id="refModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-4xl w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700">
        <h2 class="text-base md:text-lg font-bold text-white">수술 술기 및 해부학 레퍼런스 도해</h2>
        <button id="closeModalBtn" type="button" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm">닫기 ✕</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div class="bg-slate-800/70 p-3 rounded-xl border border-slate-700 flex flex-col items-center">

    let currentTime = 0.0;
    const DURATION = 14.0;
    let isPlaying = true;
    let lastTimestamp = null;

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const restartBtn = document.getElementById('restartBtn');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const captionMain = document.getElementById('captionMain');
    const captionSub = document.getElementById('captionSub');

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? '❚❚ 일시정지' : '▶ 재생';
      if (isPlaying) {
        lastTimestamp = performance.now();
      }
    });

    restartBtn.addEventListener('click', () => {
      currentTime = 0.0;
      isPlaying = true;
      playIcon.textContent = '❚❚ 일시정지';
      lastTimestamp = performance.now();
      renderScene(currentTime);
    });

    timeSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      renderScene(currentTime);
    });

    const refModal = document.getElementById('refModal');
    document.getElementById('refModalBtn').addEventListener('click', () => {
      refModal.classList.remove('hidden');
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => {
      refModal.classList.add('hidden');
    });

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpPt(p1, p2, t) {
      return [lerp(p1[0], p2[0], t), lerp(p1[1], p2[1], t)];
    }

    const SCALE = 0.52;
    function mapPt(xOrig, yOrig) {
      return [20 + xOrig * SCALE, -45 + yOrig * SCALE];
    }

    function drawRoundedRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth = 2) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = strokeStyle;
        ctx.stroke();
      }
    }

    function drawBoldArrow(ctx, pFrom, pTo, color = '#22c55e', width = 7, headSize = 16) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pFrom[0], pFrom[1]);
      ctx.lineTo(pTo[0], pTo[1]);
      ctx.stroke();

      const ang = Math.atan2(pTo[1] - pFrom[1], pTo[0] - pFrom[0]);
      ctx.beginPath();
      ctx.moveTo(pTo[0], pTo[1]);
      ctx.lineTo(pTo[0] - headSize * Math.cos(ang - 0.55), pTo[1] - headSize * Math.sin(ang - 0.55));
      ctx.lineTo(pTo[0] - headSize * Math.cos(ang + 0.55), pTo[1] - headSize * Math.sin(ang + 0.55));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBlendedFace(ctx, destX, destY, destW, destH, srcRect, liftAmount, highlightZones) {
      ctx.save();
      const [sx, sy, sw, sh] = srcRect;
      if (faceBeforeImg.complete && faceBeforeImg.naturalWidth > 0) {
        const scaleImgX = faceBeforeImg.naturalWidth / 960.0;
        const scaleImgY = faceBeforeImg.naturalHeight / 1080.0;
        ctx.drawImage(
          faceBeforeImg,
          sx * scaleImgX, sy * scaleImgY, sw * scaleImgX, sh * scaleImgY,
          destX, destY, destW, destH
        );
      }
      if (liftAmount > 0.01 && faceAfterImg.complete && faceAfterImg.naturalWidth > 0) {
        const scaleImgX = faceAfterImg.naturalWidth / 960.0;
        const scaleImgY = faceAfterImg.naturalHeight / 1080.0;
        ctx.globalAlpha = Math.min(1.0, Math.max(0.0, liftAmount));
        ctx.drawImage(
          faceAfterImg,
          sx * scaleImgX, sy * scaleImgY, sw * scaleImgX, sh * scaleImgY,
          destX, destY, destW, destH
        );
        ctx.globalAlpha = 1.0;
      }

      if (highlightZones > 0.02) {
        const scaleX = destW / sw;
        const scaleY = destH / sh;
        const toView = (xo, yo) => {
          const [bx, by] = mapPt(xo, yo);
          return [destX + (bx - sx) * scaleX, destY + (by - sy) * scaleY];
        };
        ctx.fillStyle = `rgba(45, 212, 191, ${0.30 * highlightZones})`;
        const nlC = toView(705, 1275);
        ctx.beginPath();
        ctx.ellipse(nlC[0], nlC[1], 36 * scaleX, 50 * scaleY, -0.35, 0, Math.PI * 2);
        ctx.fill();

        const mrC = toView(780, 1510);
        ctx.beginPath();
        ctx.ellipse(mrC[0], mrC[1], 52 * scaleX, 62 * scaleY, -0.15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw3DObliqueSlab(ctx, cx, cy, length, thickness, angleDeg, depthVec, topCol, frontCol, sideCol, outlineCol = 'rgba(120,90,80,0.7)', fatLobules = false) {
      const rad = (angleDeg * Math.PI) / 180.0;
      const ux = Math.cos(rad), uy = Math.sin(rad);
      const nx = -Math.sin(rad), ny = Math.cos(rad);
      const [dx, dy] = depthVec;

      const halfL = length / 2.0;
      const c0 = [cx - halfL * ux, cy - halfL * uy];
      const c1 = [cx + halfL * ux, cy + halfL * uy];
      const c2 = [c1[0] + thickness * nx, c1[1] + thickness * ny];
      const c3 = [c0[0] + thickness * nx, c0[1] + thickness * ny];

      const b0 = [c0[0] + dx, c0[1] + dy];
      const b1 = [c1[0] + dx, c1[1] + dy];
      const b3 = [c3[0] + dx, c3[1] + dy];

      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = outlineCol;

      // Top surface
      ctx.fillStyle = topCol;
      ctx.beginPath();
      ctx.moveTo(c0[0], c0[1]);
      ctx.lineTo(c1[0], c1[1]);
      ctx.lineTo(b1[0], b1[1]);
      ctx.lineTo(b0[0], b0[1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Side surface
      ctx.fillStyle = sideCol;
      ctx.beginPath();
      ctx.moveTo(c0[0], c0[1]);
      ctx.lineTo(c3[0], c3[1]);
      ctx.lineTo(b3[0], b3[1]);
      ctx.lineTo(b0[0], b0[1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Front surface
      ctx.fillStyle = frontCol;
      ctx.beginPath();
      ctx.moveTo(c0[0], c0[1]);
      ctx.lineTo(c1[0], c1[1]);
      ctx.lineTo(c2[0], c2[1]);
      ctx.lineTo(c3[0], c3[1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (fatLobules) {
        ctx.fillStyle = 'rgba(253, 224, 71, 0.95)';
        ctx.strokeStyle = 'rgba(217, 119, 6, 0.6)';
        ctx.lineWidth = 1;
        const numDots = Math.floor(length / 7.5);
        for (let i = 0; i < numDots; i++) {
          const lf = (i + 0.5) / numDots;
          for (const rRow of [0.32, 0.68]) {
            const px = lerp(c0[0], c1[0], lf) + nx * thickness * rRow;
            const py = lerp(c0[1], c1[1], lf) + ny * thickness * rRow;
            ctx.beginPath();
            ctx.ellipse(px, py, 4.5, 3.2, rad, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          }
        }
      }
      ctx.restore();

      return { c0, c1, c2, c3, b0, b1, b3, ux, uy, nx, ny };
    }

    function drawLigamentBundle(ctx, topPt, botPt, widthTop, widthBot, severedProg = 0.0, liftShift = [0, 0], reattachProg = 0.0, alpha = 1.0) {
      const numStrands = 11;
      const tx = topPt[0] + liftShift[0], ty = topPt[1] + liftShift[1];
      const bx = botPt[0], by = botPt[1];

      ctx.save();
      for (let i = 0; i < numStrands; i++) {
        const frac = i / (numStrands - 1) - 0.5;
        const xB = bx + frac * widthBot;
        const yB = by + Math.abs(frac) * 4;
        const xT = tx + frac * widthTop * 1.35;
        const yT = ty - Math.abs(frac) * 5;

        const col = i % 2 === 0 ? `rgba(225, 242, 245, ${alpha})` : `rgba(180, 218, 226, ${alpha * 0.9})`;
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;

        if (severedProg <= 0.01) {
          const midX = lerp(xB, xT, 0.5) + frac * 6;
          const midY = lerp(yB, yT, 0.5);
          ctx.beginPath();
          ctx.moveTo(xB, yB);
          ctx.quadraticCurveTo(midX, midY, xT, yT);
          ctx.stroke();
        } else {
          const gap = (0.12 + 0.28 * severedProg) * (1.0 - reattachProg);
          if (gap <= 0.03) {
            const midX = lerp(xB, xT, 0.5) + frac * 5;
            const midY = lerp(yB, yT, 0.5);
            ctx.strokeStyle = reattachProg > 0.5 ? `rgba(167, 243, 208, ${alpha})` : col;
            ctx.beginPath();
            ctx.moveTo(xB, yB);
            ctx.quadraticCurveTo(midX, midY, xT, yT);
            ctx.stroke();
          } else {
            const bEndX = lerp(xB, xT, 0.46 - gap * 0.5);
            const bEndY = lerp(yB, yT, 0.46 - gap * 0.5);
            ctx.beginPath();
            ctx.moveTo(xB, yB);
            ctx.lineTo(bEndX, bEndY);
            ctx.stroke();

            const tStartX = lerp(xB, xT, 0.54 + gap * 0.5);
            const tStartY = lerp(yB, yT, 0.54 + gap * 0.5);
            ctx.beginPath();
            ctx.moveTo(tStartX, tStartY);
            ctx.lineTo(xT, yT);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawCannula(ctx, startPt, tipPt, angleDeg, glow = 1.0) {
      const rad = (angleDeg * Math.PI) / 180.0;
      const ux = Math.cos(rad), uy = Math.sin(rad);
      ctx.save();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startPt[0], startPt[1]);
      ctx.lineTo(tipPt[0], tipPt[1]);
      ctx.stroke();

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(startPt[0], startPt[1]);
      ctx.lineTo(tipPt[0], tipPt[1]);
      ctx.stroke();

      ctx.fillStyle = '#334155';
      for (let k = 1; k <= 6; k++) {
        const px = tipPt[0] - ux * k * 8;
        const py = tipPt[1] - uy * k * 8;
        ctx.beginPath();
        ctx.arc(px, py, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }

      if (glow > 0.05) {
        ctx.fillStyle = `rgba(52, 211, 153, ${0.7 * glow})`;
        ctx.beginPath();
        ctx.arc(tipPt[0], tipPt[1], 15 * glow, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(tipPt[0], tipPt[1], 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCogThread(ctx, leftPt, rightPt, angleDeg, tensionGlow = 0.0) {
      const rad = (angleDeg * Math.PI) / 180.0;
      const ux = Math.cos(rad), uy = Math.sin(rad);
      const nx = -Math.sin(rad), ny = Math.cos(rad);

      ctx.save();
      if (tensionGlow > 0.05) {
        ctx.strokeStyle = `rgba(167, 139, 250, ${0.55 * tensionGlow})`;
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(leftPt[0], leftPt[1]);
        ctx.lineTo(rightPt[0], rightPt[1]);
        ctx.stroke();
      }

      ctx.strokeStyle = '#5850ec';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(leftPt[0], leftPt[1]);
      ctx.lineTo(rightPt[0], rightPt[1]);
      ctx.stroke();

      ctx.strokeStyle = '#c4b5fd';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(leftPt[0], leftPt[1]);
      ctx.lineTo(rightPt[0], rightPt[1]);
      ctx.stroke();

      const dist = Math.hypot(rightPt[0] - leftPt[0], rightPt[1] - leftPt[1]);
      const numCogs = Math.max(5, Math.floor(dist / 34));
      ctx.fillStyle = '#7c3aed';
      ctx.strokeStyle = 'rgba(221, 214, 254, 0.9)';
      ctx.lineWidth = 1.2;

      for (let i = 1; i < numCogs; i++) {
        const f = i / numCogs;
        const cx = lerp(leftPt[0], rightPt[0], f);
        const cy = lerp(leftPt[1], rightPt[1], f);

        const bUp = [cx + ux * 15 - nx * 12, cy + uy * 15 - ny * 12];
        const bDn = [cx + ux * 15 + nx * 12, cy + uy * 15 + ny * 12];
        const tipF = [cx - ux * 7, cy - uy * 7];
        const innerC = [cx + ux * 4, cy + uy * 4];

        ctx.beginPath();
        ctx.moveTo(tipF[0], tipF[1]);
        ctx.lineTo(bUp[0], bUp[1]);
        ctx.lineTo(innerC[0], innerC[1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(tipF[0], tipF[1]);
        ctx.lineTo(bDn[0], bDn[1]);
        ctx.lineTo(innerC[0], innerC[1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawIsometricSurgicalScene(ctx, rectBox, t, supCutProg, deepCutProg, threadInsProg, liftProg, reattachProg = 0.0, isCheek = false) {
      const [x0, y0, x1, y1] = rectBox;
      const w = x1 - x0, h = y1 - y0;
      const scale = isCheek ? w / 440.0 : w / 880.0;
      const angle = isCheek ? -26.0 : -18.0;
      const rad = (angle * Math.PI) / 180.0;
      const ux = Math.cos(rad), uy = Math.sin(rad);
      const nx = -Math.sin(rad), ny = Math.cos(rad);
      const depthVec = [-26 * scale, -20 * scale];

      const cx = x0 + w * (isCheek ? 0.52 : 0.54);
      const cy = y0 + h * (isCheek ? 0.56 : 0.58);

      const sepSup = 22.0 * scale * smoothstep(0.15, 0.85, supCutProg) * (1.0 - reattachProg);
      const sepDeep = 22.0 * scale * smoothstep(0.15, 0.85, deepCutProg) * (1.0 - reattachProg);

      const liftDist = (isCheek ? 28.0 : 50.0) * scale * liftProg;
      const archUp = (isCheek ? 8.0 : 14.0) * scale * liftProg * (1.0 - reattachProg);

      const n4Off = lerp(64.0 * scale - sepDeep * 0.3, 82.0 * scale, reattachProg);
      const n3Off = lerp(24.0 * scale - sepDeep, 60.0 * scale, reattachProg);
      const n2Off = lerp(-20.0 * scale - (sepSup + sepDeep * 0.4 + archUp), 30.0 * scale, reattachProg);
      const n1Off = lerp(-44.0 * scale - (sepSup + sepDeep * 0.4 + archUp), 10.0 * scale, reattachProg);

      const u4Shift = liftDist * 0.25 * reattachProg;
      const u3Shift = liftDist * lerp(0.35, 0.65, reattachProg);
      const u2Shift = liftDist;
      const u1Shift = liftDist;

      const shiftSupX = ux * u2Shift + nx * (n2Off + 20.0 * scale);
      const shiftSupY = uy * u2Shift + ny * (n2Off + 20.0 * scale);
      const shiftSmasX = ux * u3Shift + nx * (n3Off - 24.0 * scale);
      const shiftSmasY = uy * u3Shift + ny * (n3Off - 24.0 * scale);

      const baseL = (isCheek ? 280.0 : 560.0) * scale;

      // Layer 5: Periosteum
      const p5Cx = cx - ux * (45 * scale) + nx * (108 * scale);
      const p5Cy = cy - uy * (45 * scale) + ny * (108 * scale);
      const slab5 = draw3DObliqueSlab(
        ctx, p5Cx, p5Cy, baseL * 1.05, 20 * scale, angle, depthVec,
        'rgba(214, 204, 190, 0.96)', 'rgba(180, 168, 154, 1.0)', 'rgba(156, 144, 130, 1.0)',
        'rgba(120, 110, 100, 0.85)'
      );

      // Layer 4: Deep Fat Layer
      const p4Cx = cx - ux * (22 * scale) + ux * u4Shift + nx * n4Off;
      const p4Cy = cy - uy * (22 * scale) + uy * u4Shift + ny * n4Off;
      const slab4 = draw3DObliqueSlab(
        ctx, p4Cx, p4Cy, baseL * 0.94, 24 * scale, angle, depthVec,
        'rgba(251, 191, 36, 0.92)', 'rgba(245, 158, 11, 0.96)', 'rgba(217, 119, 6, 0.98)',
        'rgba(180, 83, 9, 0.82)', true
      );

      // Deep plane highlight
      const spaceDeepAlpha = (isCheek ? 0.72 : 0.82) * (1.0 - 0.92 * reattachProg) * smoothstep(0.05, 0.4, deepCutProg);
      if (spaceDeepAlpha > 0.03) {
        ctx.fillStyle = `rgba(180, 83, 9, ${spaceDeepAlpha})`;
        ctx.beginPath();
        ctx.moveTo(slab4.c0[0], slab4.c0[1]);
        ctx.lineTo(slab4.c1[0], slab4.c1[1]);
        ctx.lineTo(slab4.c1[0] - nx * sepDeep, slab4.c1[1] - ny * sepDeep);
        ctx.lineTo(slab4.c0[0] - nx * sepDeep, slab4.c0[1] - ny * sepDeep);
        ctx.closePath();
        ctx.fill();
      }

      const ligBot = lerpPt(slab5.c0, slab5.c1, 0.52);
      const ligMid = [ligBot[0] - nx * (54 * scale), ligBot[1] - ny * (54 * scale)];
      drawLigamentBundle(ctx, ligMid, ligBot, 68 * scale, 52 * scale, deepCutProg, [shiftSmasX, shiftSmasY], reattachProg);

      // Layer 3: SMAS Fascia
      const p3Cx = cx + ux * u3Shift + nx * n3Off;
      const p3Cy = cy + uy * u3Shift + ny * n3Off;
      const slab3 = draw3DObliqueSlab(
        ctx, p3Cx, p3Cy, baseL * 0.86, 22 * scale, angle, depthVec,
        'rgba(225, 95, 95, 0.96)', 'rgba(190, 45, 55, 1.0)', 'rgba(155, 28, 40, 1.0)',
        'rgba(127, 29, 29, 0.9)'
      );

      // Superficial plane highlight
      const spaceSupAlpha = (isCheek ? 0.70 : 0.80) * (1.0 - 0.92 * reattachProg) * smoothstep(0.05, 0.35, supCutProg);
      if (spaceSupAlpha > 0.03) {
        ctx.fillStyle = `rgba(225, 29, 72, ${spaceSupAlpha})`;
        ctx.beginPath();
        ctx.moveTo(slab3.c0[0], slab3.c0[1]);
        ctx.lineTo(slab3.c1[0], slab3.c1[1]);
        ctx.lineTo(slab3.c1[0] - nx * sepSup, slab3.c1[1] - ny * sepSup);
        ctx.lineTo(slab3.c0[0] - nx * sepSup, slab3.c0[1] - ny * sepSup);
        ctx.closePath();
        ctx.fill();
      }

      const ligSupBot = lerpPt(slab3.c0, slab3.c1, 0.48);
      const ligSupTopBase = [ligSupBot[0] - nx * (48 * scale), ligSupBot[1] - ny * (48 * scale)];
      drawLigamentBundle(ctx, ligSupTopBase, ligSupBot, 74 * scale, 56 * scale, supCutProg, [shiftSupX - shiftSmasX, shiftSupY - shiftSmasY], reattachProg);

      // Layer 2: Superficial Fat Layer
      const p2Cx = cx + ux * (24 * scale + u2Shift) + nx * n2Off;
      const p2Cy = cy + uy * (24 * scale + u2Shift) + ny * n2Off;
      const slab2 = draw3DObliqueSlab(
        ctx, p2Cx, p2Cy, baseL * 0.78, 30 * scale, angle, depthVec,
        'rgba(253, 224, 71, 0.96)', 'rgba(250, 204, 21, 1.0)', 'rgba(234, 179, 8, 1.0)',
        'rgba(161, 98, 7, 0.86)', true
      );

      // Layer 1: Epidermis & Dermis
      const p1Cx = cx + ux * (48 * scale + u1Shift) + nx * n1Off;
      const p1Cy = cy + uy * (48 * scale + u1Shift) + ny * n1Off;
      const slab1 = draw3DObliqueSlab(
        ctx, p1Cx, p1Cy, baseL * 0.70, 20 * scale, angle, depthVec,
        'rgba(253, 218, 202, 0.98)', 'rgba(244, 182, 160, 1.0)', 'rgba(225, 152, 130, 1.0)',
        'rgba(180, 110, 90, 0.9)'
      );

      // --- CANNULA STEP 1: SUPERFICIAL PLANE DISSECTION (1.2s .. 4.0s) ---
      // Accurately glides along the plane between Superficial Fat (slab2 bottom) and SMAS (slab3 top)
      if (t >= 1.2 && t <= 4.0) {
        const cProg = Math.min(1.0, Math.max(0.0, (t - 1.4) / 2.2));
        if (cProg > 0) {
          const slab2BotN = n2Off + 30.0 * scale;
          const slab3TopN = n3Off;
          let planeSupMidN = (slab2BotN + slab3TopN) / 2.0;
          if (isCheek) {
            planeSupMidN -= 7.0 * scale;
          }

          const sEntry = -baseL * 0.86 * 0.5 - 20.0 * scale;
          const sTarget = (baseL * 0.86 * 0.5) * 0.25;
          const tipS = lerp(sEntry, sTarget, cProg);
          const startS = tipS - (isCheek ? 130.0 : 240.0) * scale;

          const tipU = [cx + ux * tipS + nx * planeSupMidN, cy + uy * tipS + ny * planeSupMidN];
          const startU = [cx + ux * startS + nx * planeSupMidN, cy + uy * startS + ny * planeSupMidN];

          if (!isCheek) {
            ctx.save();
            ctx.fillStyle = `rgba(244, 63, 94, ${0.55 * smoothstep(0.05, 0.35, cProg)})`;
            ctx.beginPath();
            ctx.moveTo(cx + ux * sEntry + nx * (slab3TopN + 2*scale), cy + uy * sEntry + ny * (slab3TopN + 2*scale));
            ctx.lineTo(cx + ux * (tipS + 10*scale) + nx * (slab3TopN + 2*scale), cy + uy * (tipS + 10*scale) + ny * (slab3TopN + 2*scale));
            ctx.lineTo(cx + ux * (tipS + 10*scale) + nx * (slab2BotN - 2*scale), cy + uy * (tipS + 10*scale) + ny * (slab2BotN - 2*scale));
            ctx.lineTo(cx + ux * sEntry + nx * (slab2BotN - 2*scale), cy + uy * sEntry + ny * (slab2BotN - 2*scale));
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(52, 211, 153, 0.8)';
            ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.moveTo(cx + ux * sEntry + nx * planeSupMidN, cy + uy * sEntry + ny * planeSupMidN);
            ctx.lineTo(tipU[0], tipU[1]);
            ctx.stroke();
            ctx.restore();
          }

          const glowU = 1.4 <= t && t <= 3.8 ? 1.0 : 0.4;
          drawCannula(ctx, startU, tipU, angle, glowU);

          if (!isCheek && 1.4 <= t && t <= 3.9) {
            const arrS = [tipU[0] - ux * (60 * scale), tipU[1] - uy * (60 * scale)];
            const arrE = [tipU[0] + ux * (15 * scale), tipU[1] + uy * (15 * scale)];
            drawBoldArrow(ctx, arrS, arrE, '#22c55e', 7 * scale, 16 * scale);
          }
        }
      }

      // --- CANNULA STEP 2: DEEP PLANE DISSECTION (3.8s .. 6.8s) ---
      // Accurately glides along the plane between SMAS (slab3 bottom) and Deep Fat (slab4 top)
      if (t >= 3.8 && t <= 6.8) {
        const dProg = Math.min(1.0, Math.max(0.0, (t - 4.0) / 2.2));
        if (dProg > 0) {
          const slab3BotN = n3Off + 22.0 * scale;
          const slab4TopN = n4Off;
          let planeDeepMidN = (slab3BotN + slab4TopN) / 2.0;
          if (isCheek) {
            planeDeepMidN -= 5.0 * scale;
          }

          const sEntry = -baseL * 0.94 * 0.5 - 20.0 * scale;
          const sTarget = (baseL * 0.94 * 0.5) * 0.28;
          const tipS = lerp(sEntry, sTarget, dProg);
          const startS = tipS - (isCheek ? 130.0 : 240.0) * scale;

          const tipD = [cx + ux * tipS + nx * planeDeepMidN, cy + uy * tipS + ny * planeDeepMidN];
          const startD = [cx + ux * startS + nx * planeDeepMidN, cy + uy * startS + ny * planeDeepMidN];

          if (!isCheek) {
            ctx.save();
            ctx.fillStyle = `rgba(217, 119, 6, ${0.55 * smoothstep(0.05, 0.35, dProg)})`;
            ctx.beginPath();
            ctx.moveTo(cx + ux * sEntry + nx * (slab4TopN + 2*scale), cy + uy * sEntry + ny * (slab4TopN + 2*scale));
            ctx.lineTo(cx + ux * (tipS + 10*scale) + nx * (slab4TopN + 2*scale), cy + uy * (tipS + 10*scale) + ny * (slab4TopN + 2*scale));
            ctx.lineTo(cx + ux * (tipS + 10*scale) + nx * (slab3BotN - 2*scale), cy + uy * (tipS + 10*scale) + ny * (slab3BotN - 2*scale));
            ctx.lineTo(cx + ux * sEntry + nx * (slab3BotN - 2*scale), cy + uy * sEntry + ny * (slab3BotN - 2*scale));
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(52, 211, 153, 0.8)';
            ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.moveTo(cx + ux * sEntry + nx * planeDeepMidN, cy + uy * sEntry + ny * planeDeepMidN);
            ctx.lineTo(tipD[0], tipD[1]);
            ctx.stroke();
            ctx.restore();
          }

          const glowD = 4.0 <= t && t <= 6.4 ? 1.0 : 0.4;
          drawCannula(ctx, startD, tipD, angle, glowD);

          if (!isCheek && 4.0 <= t && t <= 6.6) {
            const arrS = [tipD[0] - ux * (60 * scale), tipD[1] - uy * (60 * scale)];
            const arrE = [tipD[0] + ux * (15 * scale), tipD[1] + uy * (15 * scale)];
            drawBoldArrow(ctx, arrS, arrE, '#22c55e', 7 * scale, 16 * scale);
          }
        }
      }

      // Barbed Cog Thread (Step 3)
      if (threadInsProg > 0.01) {
        const thRight = [slab2.c1[0] + ux * (30 * scale) + nx * (18 * scale), slab2.c1[1] + uy * (30 * scale) + ny * (18 * scale)];
        const thLeftFull = [slab2.c0[0] + ux * (15 * scale) + nx * (22 * scale), slab2.c0[1] + uy * (15 * scale) + ny * (22 * scale)];
        const thCurrLeft = lerpPt(thRight, thLeftFull, threadInsProg);
        drawCogThread(ctx, thCurrLeft, thRight, angle, liftProg);

        if (liftProg > 0.05) {
          const pulse = 0.75 + 0.25 * Math.sin(t * 8.0);
          const a1S = [p1Cx - ux * (40 * scale) - nx * (22 * scale), p1Cy - uy * (40 * scale) - ny * (22 * scale)];
          const a1E = [p1Cx + ux * (65 * scale) - nx * (22 * scale), p1Cy + uy * (65 * scale) - ny * (22 * scale)];
          drawBoldArrow(ctx, a1S, a1E, `rgba(34, 197, 94, ${pulse})`, 8 * scale, 18 * scale);

          const a2S = [p2Cx - ux * (55 * scale) + nx * (15 * scale), p2Cy - uy * (55 * scale) + ny * (15 * scale)];
          const a2E = [p2Cx + ux * (45 * scale) + nx * (15 * scale), p2Cy + uy * (45 * scale) + ny * (15 * scale)];
          drawBoldArrow(ctx, a2S, a2E, `rgba(34, 197, 94, ${pulse})`, 8 * scale, 18 * scale);
        }

        // Finale: 4-Layer Re-attachment & Firm Adhesion
        if (reattachProg > 0.08) {
          ctx.save();
          for (const slab of [slab1, slab2, slab3, slab4]) {
            const pL = lerpPt(slab.c3, slab.c2, 0.08);
            const pR = lerpPt(slab.c3, slab.c2, 0.94);
            ctx.strokeStyle = `rgba(52, 211, 153, ${0.7 * reattachProg})`;
            ctx.lineWidth = 6 * scale;
            ctx.beginPath();
            ctx.moveTo(pL[0], pL[1]);
            ctx.lineTo(pR[0], pR[1]);
            ctx.stroke();

            ctx.strokeStyle = `rgba(209, 250, 229, ${0.9 * reattachProg})`;
            ctx.lineWidth = 2.5 * scale;
            ctx.beginPath();
            ctx.moveTo(pL[0], pL[1]);
            ctx.lineTo(pR[0], pR[1]);
            ctx.stroke();
          }

          for (const fPos of [0.30, 0.70]) {
            const topAnchor = lerpPt(slab1.c0, slab1.c1, fPos);
            const arrTopS = [topAnchor[0] - nx * (40 * scale), topAnchor[1] - ny * (40 * scale)];
            const arrTopE = [topAnchor[0] - nx * (4 * scale), topAnchor[1] - ny * (4 * scale)];
            drawBoldArrow(ctx, arrTopS, arrTopE, `rgba(16, 185, 129, ${0.96 * reattachProg})`, 7 * scale, 15 * scale);

            const botAnchor = lerpPt(slab4.c3, slab4.c2, fPos);
            const arrBotS = [botAnchor[0] + nx * (36 * scale), botAnchor[1] + ny * (36 * scale)];
            const arrBotE = [botAnchor[0] + nx * (4 * scale), botAnchor[1] + ny * (4 * scale)];
            drawBoldArrow(ctx, arrBotS, arrBotE, `rgba(16, 185, 129, ${0.96 * reattachProg})`, 7 * scale, 15 * scale);
          }
          ctx.restore();
        }
      }

      if (!isCheek) {
        ctx.font = `bold ${Math.round(16 * scale)}px "Noto Sans KR", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const badges = [
          ['피부층 (표피·진피 EPIDERMIS/DERMIS)', slab1.b0, [-145 * scale, -58 * scale], 'rgba(133, 94, 43, 0.96)'],
          ['표층지방층 (SUPERFICIAL FAT)', slab2.b0, [-175 * scale, -42 * scale], 'rgba(146, 104, 48, 0.96)'],
          ['SMAS 근막층 (SMAS FORMATION)', slab3.b0, [-195 * scale, -28 * scale], 'rgba(115, 72, 28, 0.96)'],
          ['심부지방층 (DEEP FAT LAYER)', slab4.b0, [-185 * scale, 12 * scale], 'rgba(140, 88, 34, 0.96)'],
          ['유지인대 (RETAINING LIGAMENTS)', ligBot, [55 * scale, 52 * scale], 'rgba(98, 62, 24, 0.96)'],
        ];
        for (const [textLbl, anchorPt, [ox, oy], pillCol] of badges) {
          const bx = Math.max(140 * scale, Math.min(w - 150 * scale, anchorPt[0] - x0 + ox)) + x0;
          const by = Math.max(35 * scale, Math.min(h - 35 * scale, anchorPt[1] - y0 + oy)) + y0;
          ctx.strokeStyle = 'rgba(133, 94, 43, 0.78)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(anchorPt[0], anchorPt[1]);
          ctx.lineTo(bx, by);
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#73481c';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(anchorPt[0], anchorPt[1], 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          const tw = textLbl.length * 9.5 * scale;
          drawRoundedRect(ctx, bx - tw / 2 - 12, by - 16 * scale, tw + 24, 32 * scale, 15 * scale, pillCol, 'rgba(255, 245, 230, 0.86)', 2);
          ctx.fillStyle = '#fffdf5';
          ctx.fillText(textLbl, bx, by);
        }
      }
    }

    function renderScene(t) {
      const W = 1920, H = 1080;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#f8f4ee';
      ctx.fillRect(0, 0, W, H);

      const supCutProg = smoothstep(1.4, 3.6, t);
      const deepCutProg = smoothstep(4.0, 6.4, t);
      const threadInsProg = smoothstep(7.1, 8.1, t);
      const liftProg = smoothstep(8.1, 9.4, t);
      const reattachProg = smoothstep(9.4, 10.8, t);
      const compareBlend = smoothstep(11.0, 11.5, t);

      // PART 1: Surgical Animation View
      if (compareBlend < 0.99) {
        const hlZone = smoothstep(8.8, 10.2, t) * 0.75;
        drawBlendedFace(ctx, 0, 0, 960, 1080, [0, 0, 960, 1080], liftProg, hlZone);

        ctx.fillStyle = 'rgba(255, 250, 245, 0.82)';
        ctx.strokeStyle = 'rgba(180, 110, 90, 0.94)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(305, 515);
        ctx.lineTo(615, 415);
        ctx.lineTo(655, 635);
        ctx.lineTo(345, 735);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(140, 100, 75, 0.63)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(615, 415);
        ctx.lineTo(880, 115);
        ctx.moveTo(655, 635);
        ctx.lineTo(880, 885);
        ctx.stroke();

        drawIsometricSurgicalScene(ctx, [275, 420, 665, 745], t, supCutProg, deepCutProg, threadInsProg, liftProg, reattachProg, true);

        if (liftProg > 0.05) {
          drawBoldArrow(ctx, [385, 665], [545, 565], 'rgba(20, 184, 166, 0.9)', 6, 15);
          drawBoldArrow(ctx, [405, 745], [575, 640], 'rgba(20, 184, 166, 0.9)', 6, 15);
        }

        const nlPt = mapPt(710, 1275);
        const mrPt = mapPt(745, 1485);
        const jwPt = mapPt(835, 1590);
        const lblCol = liftProg < 0.35 ? '#dc2626' : '#0d9488';
        const statusTxt = liftProg < 0.35 ? '처짐' : '완전 리프팅';

        ctx.strokeStyle = lblCol;
        ctx.lineWidth = 2;
        ctx.fillStyle = lblCol;

        ctx.beginPath();
        ctx.arc(nlPt[0], nlPt[1], 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(nlPt[0], nlPt[1]);
        ctx.lineTo(165, 560);
        ctx.stroke();
        drawRoundedRect(ctx, 35, 538, 250, 44, 10, 'rgba(255,255,255,0.94)', lblCol, 2);

        ctx.beginPath();
        ctx.arc(mrPt[0], mrPt[1], 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(mrPt[0], mrPt[1]);
        ctx.lineTo(165, 680);
        ctx.stroke();
        drawRoundedRect(ctx, 25, 658, 270, 44, 10, 'rgba(255,255,255,0.94)', lblCol, 2);

        ctx.beginPath();
        ctx.arc(jwPt[0], jwPt[1], 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(jwPt[0], jwPt[1]);
        ctx.lineTo(165, 800);
        ctx.stroke();
        drawRoundedRect(ctx, 30, 778, 260, 44, 10, 'rgba(255,255,255,0.94)', lblCol, 2);

        ctx.font = 'bold 18px "Noto Sans KR", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = lblCol;
        ctx.fillText(`깊은 팔자주름 (${statusTxt})`, 160, 560);
        ctx.fillText(`마리오네트 라인 주름 (${statusTxt})`, 160, 680);
        ctx.fillText(`볼처짐 · 심술보 (${statusTxt})`, 160, 800);

        // Right 3D Stepped Anatomical Scene Card
        drawRoundedRect(ctx, 870, 105, 1015, 940, 24, 'rgba(255,255,255,0.97)', '#d7cdc3', 3);
        drawRoundedRect(ctx, 870, 105, 1015, 67, 24, '#1e293b', null, 0);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Noto Sans KR", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('사선형 3D 입체 피부계층 단면도 (피부 · 표층지방 · SMAS · 심부지방 · 유지인대)', 915, 138);

        drawIsometricSurgicalScene(ctx, [880, 175, 1875, 885], t, supCutProg, deepCutProg, threadInsProg, liftProg, reattachProg, false);

        let capTitle = '', capSub = '', badgeBg = '#475569';
        if (t < 1.3) {
          capTitle = 'STEP 0. 시술 전 해부학적 구조 : 표층·심부 유지인대가 피부층과 하부 골막을 강하게 결속';
          capSub = '유지인대(Retaining Ligaments)의 하방 구속으로 인해 팔자주름, 마리오네트 라인 및 하안면 볼처짐 발생';
          badgeBg = '#475569';
        } else if (t < 3.9) {
          capTitle = 'STEP 1. 표층 박리 (1st Plane) : 표층지방 하방 및 표층 유지인대 정밀 박리';
          capSub = '특수 캐뉼라가 표층지방과 SMAS 사이 플레인을 정확히 지나가며 확장된 간극 내 유지인대를 해리';
          badgeBg = '#0369a1';
        } else if (t < 7.0) {
          capTitle = 'STEP 2. 심부 박리 (2nd Plane) : SMAS 하방 심부지방 및 심부 유지인대 박리 완료';
          capSub = '피부층과 SMAS가 하부 골막으로부터 완벽 분리되어 표층 조직의 상방 가동성(Mobility) 극대화';
          badgeBg = '#b45309';
        } else if (t < 9.4) {
          capTitle = 'STEP 3-1. 가시실(Cog) 상방 견인 : 반대 대각선 방향 돌기 배치로 표층 조직 강력 거상';
          capSub = '반대 대각선 방향으로 배열된 가시실이 박리된 피부 및 표층지방층을 걸어 처짐 역방향으로 상방 견인';
          badgeBg = '#6d28d9';
        } else {
          capTitle = 'STEP 3-2. 4대 계층 조직 재유착 (Re-adhesion) : 피부 · 표층지방 · SMAS · 심부지방 단단한 밀착 고정';
          capSub = '상방 거상 위치에서 4개 층이 완전 밀착·재유착되어 처짐 재발 없이 반영구적 V라인 리프팅 완성';
          badgeBg = '#0d9488';
        }

        drawRoundedRect(ctx, 895, 895, 965, 130, 18, '#f8fafc', badgeBg, 2);
        ctx.textAlign = 'center';
        ctx.fillStyle = badgeBg;
        ctx.font = 'bold 23px "Noto Sans KR", sans-serif';
        ctx.fillText(capTitle, 1377, 935);
        ctx.fillStyle = '#475569';
        ctx.font = '18px "Noto Sans KR", sans-serif';
        ctx.fillText(capSub, 1377, 985);

        captionMain.textContent = capTitle;
        captionSub.textContent = capSub;
      }

      // PART 2: Final Before & After Reminder Scene
      if (compareBlend > 0.01) {
        ctx.save();
        ctx.globalAlpha = compareBlend;
        ctx.fillStyle = '#f6f3ee';
        ctx.fillRect(0, 100, W, 960);

        drawRoundedRect(ctx, 45, 105, 890, 940, 24, '#ffffff', '#e11d48', 3);
        drawBlendedFace(ctx, 65, 175, 840, 680, [60, 190, 840, 720], 0.0, 0.0);

        drawRoundedRect(ctx, 65, 120, 455, 55, 14, '#e11d48', null, 0);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 23px "Noto Sans KR", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('BEFORE (시술 전 : 주름·볼처짐)', 292, 147);

        const nlB = [65 + (mapPt(710, 1275)[0] - 60), 175 + (mapPt(710, 1275)[1] - 190) * (680 / 720)];
        const mrB = [65 + (mapPt(745, 1490)[0] - 60), 175 + (mapPt(745, 1490)[1] - 190) * (680 / 720)];
        const jwB = [65 + (mapPt(835, 1590)[0] - 60), 175 + (mapPt(835, 1590)[1] - 190) * (680 / 720)];

        ctx.strokeStyle = '#e11d48';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(nlB[0], nlB[1], 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mrB[0], mrB[1], 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(jwB[0], jwB[1], 38, 32, 0, 0, Math.PI * 2);
        ctx.stroke();

        drawRoundedRect(ctx, 535, 455, 380, 60, 12, '#fff1f2', '#e11d48', 2);
        drawRoundedRect(ctx, 535, 565, 380, 60, 12, '#fff1f2', '#e11d48', 2);
        drawRoundedRect(ctx, 535, 675, 380, 60, 12, '#fff1f2', '#e11d48', 2);

        ctx.beginPath();
        ctx.moveTo(nlB[0] + 34, nlB[1]);
        ctx.lineTo(535, 485);
        ctx.moveTo(mrB[0] + 34, mrB[1]);
        ctx.lineTo(535, 595);
        ctx.moveTo(jwB[0] + 36, jwB[1]);
        ctx.lineTo(535, 705);
        ctx.stroke();

        ctx.fillStyle = '#be123c';
        ctx.font = 'bold 21px "Noto Sans KR", sans-serif';
        ctx.fillText('깊은 팔자주름 (상악 유지인대 처짐)', 725, 485);
        ctx.fillText('선명한 마리오네트 라인 주름', 725, 595);
        ctx.fillText('하안면 볼처짐 (심술보·턱선 무너짐)', 725, 705);

        drawRoundedRect(ctx, 75, 885, 830, 140, 16, '#881337', '#fb7185', 2);
        ctx.fillStyle = '#fecdd3';
        ctx.font = 'bold 21px "Noto Sans KR", sans-serif';
        ctx.fillText('시술 전 근본 원인 : 표층·심부 유지인대가 피부를 아래로 강하게 견인', 490, 930);
        ctx.fillStyle = '#ffe4e6';
        ctx.font = '18px "Noto Sans KR", sans-serif';
        ctx.fillText('유지인대 박리 없이는 처진 지방패드가 들리지 않아 주름·볼처짐이 심화됨', 490, 980);

        // AFTER Card
        drawRoundedRect(ctx, 985, 105, 890, 940, 24, '#ffffff', '#0d9488', 3);
        drawBlendedFace(ctx, 1005, 175, 840, 680, [60, 190, 840, 720], 1.0, 0.85);

        drawRoundedRect(ctx, 1005, 120, 525, 55, 14, '#0d9488', null, 0);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 23px "Noto Sans KR", sans-serif';
        ctx.fillText('AFTER (듀얼플레인 박리 실리프팅 거상 후)', 1267, 147);

        const nlA = [1005 + (mapPt(710, 1275)[0] - 60), 175 + (mapPt(710, 1275)[1] - 190) * (680 / 720)];
        const mrA = [1005 + (mapPt(745, 1490)[0] - 60), 175 + (mapPt(745, 1490)[1] - 190) * (680 / 720)];
        const jwA = [1005 + (mapPt(835, 1560)[0] - 60), 175 + (mapPt(835, 1560)[1] - 190) * (680 / 720)];

        ctx.strokeStyle = '#0d9488';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(nlA[0], nlA[1], 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(mrA[0], mrA[1], 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(jwA[0], jwA[1], 38, 32, 0, 0, Math.PI * 2);
        ctx.stroke();

        drawBoldArrow(ctx, [nlA[0] + 22, nlA[1] + 5], [nlA[0] + 130, nlA[1] - 75], '#0d9488', 6, 16);
        drawBoldArrow(ctx, [mrA[0] + 22, mrA[1] + 5], [mrA[0] + 140, mrA[1] - 80], '#0d9488', 6, 16);
        drawBoldArrow(ctx, [jwA[0] + 15, jwA[1] - 5], [jwA[0] + 120, jwA[1] - 90], '#0d9488', 6, 16);

        drawRoundedRect(ctx, 1460, 455, 395, 60, 12, '#f0fdfa', '#0d9488', 2);
        drawRoundedRect(ctx, 1460, 565, 395, 60, 12, '#f0fdfa', '#0d9488', 2);
        drawRoundedRect(ctx, 1460, 675, 395, 60, 12, '#f0fdfa', '#0d9488', 2);

        ctx.beginPath();
        ctx.moveTo(nlA[0] + 34, nlA[1]);
        ctx.lineTo(1460, 485);
        ctx.moveTo(mrA[0] + 34, mrA[1]);
        ctx.lineTo(1460, 595);
        ctx.moveTo(jwA[0] + 36, jwA[1]);
        ctx.lineTo(1460, 705);
        ctx.stroke();

        ctx.fillStyle = '#0f766e';
        ctx.font = 'bold 21px "Noto Sans KR", sans-serif';
        ctx.fillText('팔자주름 완전 소실 · 앞볼 입체 볼륨 복원', 1657, 485);
        ctx.fillText('마리오네트 라인 주름 소실 · 입가 리프팅', 1657, 595);
        ctx.fillText('볼처짐 완벽 거상 · 매끈하고 날렵한 V라인', 1657, 705);

        drawRoundedRect(ctx, 1015, 885, 830, 140, 16, '#0f172a', '#2dd4bf', 2);
        ctx.fillStyle = '#5eead4';
        ctx.font = 'bold 21px "Noto Sans KR", sans-serif';
        ctx.fillText('핵심 기전 : 듀얼플레인 2단계 박리 후 가시실 견인 + 4대 계층 단단한 재유착 달성', 1430, 930);
        ctx.fillStyle = '#f1f5f9';
        ctx.font = '18px "Noto Sans KR", sans-serif';
        ctx.fillText('하부 저항 없이 자유로워진 조직을 올바른 위치에 밀착 재유착시켜 반영구적 유지', 1430, 980);

        captionMain.textContent = 'STEP 4. 시술 전·후 비교 : 깊은 주름 소실 및 매끈한 V라인 거상 완성';
        captionSub.textContent = '듀얼플레인 2단계 박리로 하방 구속을 해제하고 가시실 상방 견인 후 4대 계층이 단단히 재유착됩니다.';
        ctx.restore();
      }

      // Top Bar (ONLY title)
      drawRoundedRect(ctx, 570, 20, 780, 68, 18, '#0f172a', 'rgba(45, 212, 191, 0.7)', 2);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('듀얼플레인 박리 실리프팅 거상술', 960, 54);

      // Clinic Logo (1/30 Screen Area = 304x228, 80% Transparency)
      if (logoWatermarkImg.complete && logoWatermarkImg.naturalWidth > 0) {
        const lw = 304, lh = 228;
        ctx.drawImage(logoWatermarkImg, (W - lw) / 2, (H - lh) / 2, lw, lh);
      }

      timeDisplay.textContent = `${t.toFixed(1)}s`;
    }

    function animate(ts) {
      if (!lastTimestamp) lastTimestamp = ts;
      const dt = (ts - lastTimestamp) / 1000.0;
      lastTimestamp = ts;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime > DURATION) {
          currentTime = 0.0;
        }
        timeSlider.value = currentTime.toFixed(2);
        renderScene(currentTime);
      }
      requestAnimationFrame(animate);
    }

    let loadedCount = 0;
    const checkStart = () => {
      loadedCount++;
      if (loadedCount >= 2) {
        renderScene(0.0);
        requestAnimationFrame(animate);
      }
    };
    faceBeforeImg.onload = checkStart;
    faceAfterImg.onload = checkStart;
    logoWatermarkImg.onload = checkStart;

    setTimeout(() => {
      renderScene(currentTime);
      requestAnimationFrame(animate);
    }, 200);
  </script>
</body>
</html>
